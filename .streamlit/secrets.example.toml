# Copy this file to .streamlit/secrets.toml and fill in real values.
# .streamlit/secrets.toml is gitignored — never commit it.
# Environment variables of the same names (MYSQL_HOST, MYSQL_USER, ...) also work.

[mysql]
host = "127.0.0.1"
port = 3306
user = "your_mysql_username"
password = "your_mysql_password"
database = "college_scorecard"

[firebase]
# Repo-relative or absolute path to the Firebase service-account JSON key.
# The JSON file itself is gitignored via the *serviceAccount*.json pattern.
service_account_path = "secrets/college-scorecard-serviceAccount.json"
